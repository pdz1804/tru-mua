name: Secret scan

# Gitleaks over the full git history (the repo is small, so a full scan takes seconds).
# CI calls this on every push and PR (workflow_call) so the result feeds the Quality report;
# the weekly schedule re-scans with the same pinned rules. The binary is the pinned release,
# verified by SHA-256 (no third-party action, no licence key, no PR comments).
on:
  workflow_call:
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: Gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
      - name: Scan git history
        run: |
          set -o pipefail
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --report-format sarif --report-path gitleaks.sarif
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          n=$(jq '[.runs[].results[]] | length' gitleaks.sarif 2>/dev/null || echo "?")
          {
            echo "### Secret scan (gitleaks ${GITLEAKS_VERSION}): $n finding(s)"
            jq -r '.runs[].results[] | "- `\(.ruleId)` in `\(.locations[0].physicalLocation.artifactLocation.uri)`"' gitleaks.sarif 2>/dev/null | head -20
          } >> "$GITHUB_STEP_SUMMARY"
