name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  quality:
    name: Lint, types, unit tests, build, private-data scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint -- --max-warnings=0
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:private
      - run: npm run check:models
      # build also runs the private-data scan against the shipped bundle
      - run: npm run build
      - name: Bundle report
        run: |
          {
            echo '### Bundle'
            echo '| File | Size | Gzip |'
            echo '|---|---:|---:|'
            for f in dist/assets/*.js dist/assets/*.css; do
              printf '| `%s` | %s KB | %s KB |\n' "$(basename "$f")" \
                "$(( $(stat -c%s "$f") / 1024 ))" "$(( $(gzip -c "$f" | wc -c) / 1024 ))"
            done
            echo
            echo "Models: $(ls public/models/designer/*.glb | wc -l) files, $(du -sh public/models/designer | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # the pinned CLI over the full history; no third-party action or token needed
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose --report-format sarif --report-path gitleaks.sarif

  e2e:
    name: Browser walkthrough (${{ matrix.project }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # desktop and phone run on separate runners: each gets all 4 vCPUs for software WebGL
      matrix:
        project: [desktop, mobile]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=${{ matrix.project }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  # one stable required check for branch protection, whatever the matrix becomes
  ci-passed:
    name: CI passed
    if: always()
    needs: [quality, commits, secrets, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All required jobs succeeded
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
